[project]
name = "chunkkv"
version = "0.1.0"
description = "Content-addressed, provenance-keyed KV cache reuse for RAG and agents (MLX)"
readme = "README.md"
authors = [
    { name = "Nithin", email = "sarvanithin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.32.4",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
